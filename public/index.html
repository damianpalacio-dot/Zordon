<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zordon Financial Adviser</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/fonts/inter/latin-400.css">
  <link rel="stylesheet" href="/vendor/fonts/inter/latin-500.css">
  <link rel="stylesheet" href="/vendor/fonts/inter/latin-600.css">
  <link rel="stylesheet" href="/vendor/fonts/inter/latin-700.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="#/adviser" aria-label="Zordon Command Center">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M18 2 6 18h8l-2 12 14-18h-8l2-10z"/></svg>
        <span>Zordon</span>
      </a>
      <a href="#/adviser" data-view="adviser"><i>◎</i><span>Adviser</span></a>
      <a href="#/changeorders" data-view="changeorders"><i>💲</i><span>Change Orders</span></a>
      <a href="#/board?category=billing" data-view="board"><i>💵</i><span>Billing</span></a>
      <a href="#/workbook" data-view="workbook"><i>📒</i><span>Job Control Workbook</span></a>
      <a href="#/claude" data-view="claude"><i>🤖</i><span>Claude Link</span><b class="badge" id="badge-claude" hidden></b></a>
      <button class="more-toggle" id="more-toggle" type="button" aria-expanded="false">More tools</button>
      <div class="more-tools" id="more-tools" hidden>
        <a href="#/command" data-view="command"><i>⌂</i><span>Command</span></a>
        <a href="#/focus" data-view="focus"><i>⚑</i><span>My Focus</span></a>
        <a href="#/projects" data-view="projects"><i>◈</i><span>Projects</span></a>
        <a href="#/doccontrol" data-view="doccontrol"><i>📐</i><span>RFIs &amp; Submittals</span><b class="badge" id="badge-doccontrol" hidden></b></a>
        <a href="#/schedule" data-view="schedule"><i>▤</i><span>Schedule &amp; Equip.</span></a>
        <a href="#/meetings" data-view="meetings"><i>◷</i><span>Meetings</span></a>
        <a href="#/inbox" data-view="inbox"><i>✉</i><span>Email Intel</span><b class="badge" id="badge-inbox" hidden></b></a>
        <a href="#/reminders" data-view="reminders"><i>✆</i><span>Reminders</span><b class="badge" id="badge-reminders" hidden></b></a>
        <a href="#/onedrive" data-view="onedrive"><i>📁</i><span>OneDrive</span></a>
        <a href="#/vault" data-view="vault"><i>🗄</i><span>File Vault</span></a>
        <a href="#/team" data-view="team"><i>☗</i><span>Rangers</span></a>
      </div>
    </nav>
    <div class="content">
      <div id="demo-banner" class="demo-banner" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
